<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Camera</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0d;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.1rem; font-weight: 500; opacity: 0.7; margin: 0; }
  h2 { font-size: 0.95rem; font-weight: 500; opacity: 0.6; margin: 24px 0 0; }
  .frame {
    position: relative;
    max-width: 90vw;
    max-height: 70vh;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  video {
    display: block;
    max-width: 90vw;
    max-height: 70vh;
    transform: scaleX(-1); /* mirror, feels more natural */
  }
  .rec-dot {
    position: absolute;
    top: 10px;
    left: 10px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
  }
  .rec-dot.active { display: flex; }
  .rec-dot span.dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e5484d; animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .task-card {
    display: none;
    max-width: 90vw;
    background: #14141a;
    border: 1px solid #2a2a2e;
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
  }
  .task-card.active { display: block; }
  .task-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  #taskText { font-size: 1rem; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  select, button {
    background: #1c1c1f;
    color: #eee;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover, select:hover { background: #2a2a2e; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.recording { background: #4a1a1c; border-color: #e5484d; }
  #status { font-size: 0.85rem; opacity: 0.6; min-height: 1.2em; }
  #snapshot { display: none; }
  a.download-link {
    color: #8ab4f8;
    font-size: 0.85rem;
  }

  #archiveSection { width: 100%; max-width: 900px; }
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .archive-header h2 { margin: 24px 0 0; }
  #clearBtn { font-size: 0.8rem; padding: 6px 10px; }
  .archive-empty { opacity: 0.5; font-size: 0.85rem; margin-top: 8px; }

  .archive-folder { margin-top: 20px; }
  .archive-folder-title {
    font-size: 0.85rem;
    opacity: 0.75;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2a2a2e;
  }
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .archive-item {
    background: #1c1c1f;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a2a2e;
    display: flex;
    flex-direction: column;
  }
  .archive-item img, .archive-item video {
    width: 100%;
    height: 110px;
    object-fit: cover;
    background: #000;
    display: block;
  }
  .archive-item-meta {
    padding: 6px 8px;
    font-size: 0.7rem;
    opacity: 0.6;
  }
  .archive-item-actions {
    display: flex;
    gap: 4px;
    padding: 0 8px 8px;
  }
  .archive-item-actions button, .archive-item-actions a {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    padding: 5px 6px;
    border-radius: 6px;
    text-decoration: none;
  }
</style>
</head>
<body>

<h1>Live Camera Feed</h1>

<div class="frame">
  <video id="video" autoplay playsinline muted></video>
  <div class="rec-dot" id="recDot"><span class="dot"></span><span>REC</span></div>
</div>

<div class="task-card" id="taskCard">
  <div class="task-label">Your task</div>
  <div id="taskText"></div>
</div>

<div class="controls">
  <select id="cameraSelect"></select>
  <button id="toggleBtn">Start</button>
  <button id="snapBtn" disabled>Take Snapshot</button>
  <button id="recordBtn" disabled>Record Video</button>
  <button id="mirrorBtn">Toggle Mirror</button>
  <button id="importBtn">Import</button>
  <input type="file" id="importInput" accept="image/*,video/*" multiple style="display:none">
</div>

<div id="status">Camera is off.</div>
<a id="snapLink" class="download-link" download="snapshot.png" style="display:none">Download snapshot</a>

<canvas id="snapshot"></canvas>

<div id="archiveSection">
  <div class="archive-header">
    <h2>Archive (saved on this device)</h2>
    <button id="clearBtn">Clear archive</button>
  </div>
  <div class="archive-empty" id="archiveEmpty">Nothing saved yet. Snapshots and recordings you take here will show up below, on this browser only.</div>
  <div id="archiveContainer"></div>
</div>

<script>
const video = document.getElementById('video');
const toggleBtn = document.getElementById('toggleBtn');
const snapBtn = document.getElementById('snapBtn');
const recordBtn = document.getElementById('recordBtn');
const mirrorBtn = document.getElementById('mirrorBtn');
const importBtn = document.getElementById('importBtn');
const importInput = document.getElementById('importInput');
const cameraSelect = document.getElementById('cameraSelect');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('snapshot');
const snapLink = document.getElementById('snapLink');
const recDot = document.getElementById('recDot');
const taskCard = document.getElementById('taskCard');
const taskTextEl = document.getElementById('taskText');
const archiveContainer = document.getElementById('archiveContainer');
const archiveEmpty = document.getElementById('archiveEmpty');
const clearBtn = document.getElementById('clearBtn');

let stream = null;
let mirrored = true;
let mediaRecorder = null;
let recordedChunks = [];
let currentTask = null;

/* ---------- Silly tasks ---------- */

const TASKS = [
  'Strike your best "design thinking" pose — chin stroke, squint, stare meaningfully at a whiteboard.',
  'Build a tiny sculpture out of sticky notes and photograph it like museum art.',
  'Find three different colored Post-its and wear them like a medal.',
  'Recreate a meme using only office supplies within arm\'s reach.',
  'Recreate a famous painting using only what\'s on your desk.',
  'Show us your "I\'ve had too much coffee" stare.',
  'Pretend you\'re presenting to a room of 500 people, but it\'s just the camera.',
  'Balance a pen on your nose (or attempt to, dramatically failing counts).',
  'Show your best shrimp-working pose.',
  'Strike a pose like you just invented the sticky note.'
];

function pickNewTask() {
  currentTask = TASKS[Math.floor(Math.random() * TASKS.length)];
  taskTextEl.textContent = currentTask;
  taskCard.classList.add('active');
}

function clearTask() {
  currentTask = null;
  taskCard.classList.remove('active');
}

/* ---------- IndexedDB archive storage ---------- */

const DB_NAME = 'webcamArchiveDB';
const STORE_NAME = 'items';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function addArchiveItem(blob, type, category) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ blob, type, category: category || 'Uncategorized', timestamp: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getAllArchiveItems() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result.sort((a, b) => b.timestamp - a.timestamp));
    req.onerror = () => reject(req.error);
  });
}

async function deleteArchiveItem(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function clearArchive() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function buildArchiveCard(item) {
  const url = URL.createObjectURL(item.blob);
  const card = document.createElement('div');
  card.className = 'archive-item';

  const media = document.createElement(item.type === 'video' ? 'video' : 'img');
  media.src = url;
  if (item.type === 'video') { media.controls = true; }
  card.appendChild(media);

  const meta = document.createElement('div');
  meta.className = 'archive-item-meta';
  meta.textContent = (item.type === 'video' ? 'Video' : 'Photo') + ' — ' + new Date(item.timestamp).toLocaleString();
  card.appendChild(meta);

  const actions = document.createElement('div');
  actions.className = 'archive-item-actions';

  const dl = document.createElement('a');
  dl.href = url;
  dl.download = (item.type === 'video' ? 'recording-' : 'snapshot-') + item.timestamp + (item.type === 'video' ? '.webm' : '.png');
  dl.textContent = 'Download';
  dl.style.background = '#1c1c1f';
  dl.style.border = '1px solid #333';
  dl.style.color = '#eee';
  actions.appendChild(dl);

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete';
  delBtn.addEventListener('click', async () => {
    await deleteArchiveItem(item.id);
    renderArchive();
  });
  actions.appendChild(delBtn);

  card.appendChild(actions);
  return card;
}

async function renderArchive() {
  const items = await getAllArchiveItems();
  archiveContainer.innerHTML = '';
  archiveEmpty.style.display = items.length ? 'none' : 'block';
  if (!items.length) return;

  // group items by category (i.e. "folder")
  const groups = new Map();
  items.forEach(item => {
    const key = item.category || 'Uncategorized';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });

  // stable folder order: tasks in their defined order, then Imported, then anything else
  const orderedKeys = [];
  TASKS.forEach(t => { if (groups.has(t)) orderedKeys.push(t); });
  ['Imported', 'Uncategorized'].forEach(k => { if (groups.has(k) && !orderedKeys.includes(k)) orderedKeys.push(k); });
  groups.forEach((_, k) => { if (!orderedKeys.includes(k)) orderedKeys.push(k); });

  orderedKeys.forEach(key => {
    const groupItems = groups.get(key);
    const folder = document.createElement('div');
    folder.className = 'archive-folder';

    const title = document.createElement('div');
    title.className = 'archive-folder-title';
    title.textContent = key + ' (' + groupItems.length + ')';
    folder.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'archive-grid';
    groupItems.forEach(item => grid.appendChild(buildArchiveCard(item)));
    folder.appendChild(grid);

    archiveContainer.appendChild(folder);
  });
}

clearBtn.addEventListener('click', async () => {
  if (!confirm('Delete everything in the archive on this device? This cannot be undone.')) return;
  await clearArchive();
  renderArchive();
});

/* ---------- Import from file (e.g. photos taken on your phone) ---------- */

importBtn.addEventListener('click', () => importInput.click());

importInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  statusEl.textContent = 'Importing ' + files.length + ' file(s)...';
  for (const file of files) {
    const type = file.type.startsWith('video') ? 'video' : 'photo';
    await addArchiveItem(file, type, 'Imported');
  }
  importInput.value = '';
  await renderArchive();
  statusEl.textContent = stream ? 'Live.' : 'Camera is off.';
});

/* ---------- Camera ---------- */

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cameraSelect.innerHTML = '';
    cams.forEach((cam, i) => {
      const opt = document.createElement('option');
      opt.value = cam.deviceId;
      opt.textContent = cam.label || `Camera ${i + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch (err) {
    // labels/devices may be empty until permission is granted; that's fine
  }
}

async function startCamera() {
  try {
    statusEl.textContent = 'Requesting camera access...';
    const constraints = {
      video: cameraSelect.value
        ? { deviceId: { exact: cameraSelect.value } }
        : true,
      audio: true
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await listCameras(); // refresh labels now that permission is granted
    toggleBtn.textContent = 'Stop';
    snapBtn.disabled = false;
    recordBtn.disabled = false;
    statusEl.textContent = 'Live.';
    pickNewTask();
  } catch (err) {
    statusEl.textContent = 'Could not access camera: ' + err.message;
  }
}

function stopCamera() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  toggleBtn.textContent = 'Start';
  snapBtn.disabled = true;
  recordBtn.disabled = true;
  statusEl.textContent = 'Camera is off.';
  clearTask();
}

toggleBtn.addEventListener('click', () => {
  if (stream) stopCamera(); else startCamera();
});

mirrorBtn.addEventListener('click', () => {
  mirrored = !mirrored;
  video.style.transform = mirrored ? 'scaleX(-1)' : 'none';
});

/* ---------- Snapshot ---------- */

snapBtn.addEventListener('click', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  if (mirrored) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const dataUrl = canvas.toDataURL('image/png');
    snapLink.href = dataUrl;
    snapLink.style.display = 'inline-block';
    snapLink.textContent = 'Download snapshot (' + new Date().toLocaleTimeString() + ')';
    await addArchiveItem(blob, 'photo', currentTask);
    renderArchive();
  }, 'image/png');
});

/* ---------- Video recording ---------- */

function pickMimeType() {
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

recordBtn.addEventListener('click', () => {
  if (!stream) return;
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  recordedChunks = [];
  const mimeType = pickMimeType();
  const taskAtRecordStart = currentTask;
  try {
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  } catch (err) {
    statusEl.textContent = 'Recording not supported: ' + err.message;
    return;
  }
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    recDot.classList.remove('active');
    recordBtn.classList.remove('recording');
    recordBtn.textContent = 'Record Video';
    if (recordedChunks.length) {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
      await addArchiveItem(blob, 'video', taskAtRecordStart);
      renderArchive();
    }
    statusEl.textContent = stream ? 'Live.' : 'Camera is off.';
  };
  mediaRecorder.start();
  recDot.classList.add('active');
  recordBtn.classList.add('recording');
  recordBtn.textContent = 'Stop Recording';
  statusEl.textContent = 'Recording...';
});

cameraSelect.addEventListener('change', () => {
  if (stream) { stopCamera(); startCamera(); }
});

window.addEventListener('beforeunload', stopCamera);

listCameras();
renderArchive();
</script>

</body>
</html>
