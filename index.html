<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eae5d8;
    --paper2: #f2efe6;
    --ink: #1b1916;
    --line: #b6ae9a;
    --accent: #b5433a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(27,25,22,0.16) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 28px 24px 60px;
  }

  .meta-bar {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    opacity: 0.75;
  }

  h1 {
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 5.5vw, 3rem);
    line-height: 0.95;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    text-align: center;
    margin: 4px 0 0;
  }
  h2 {
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: 1.1rem;
    text-transform: uppercase;
    margin: 0;
  }

  .frame {
    position: relative;
    max-width: 95vw;
    max-height: 78vh;
    border: 2px solid var(--ink);
    border-radius: 2px;
    overflow: hidden;
    background: #000;
  }
  video {
    display: block;
    max-width: 95vw;
    max-height: 78vh;
    transform: scaleX(-1);
  }
  .frame:fullscreen, .frame:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
  }
  .frame:fullscreen video, .frame:-webkit-full-screen video {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  .rec-dot {
    position: absolute;
    top: 10px;
    left: 10px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 2px;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: #f2efe6;
    z-index: 2;
    text-transform: uppercase;
  }
  .rec-dot.active { display: flex; }
  .rec-dot span.dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .fs-controls {
    display: none;
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    gap: 8px;
    z-index: 3;
  }
  .frame:fullscreen .fs-controls, .frame:-webkit-full-screen .fs-controls { display: flex; }
  .fs-controls button {
    background: rgba(0,0,0,0.65);
    color: #f2efe6;
    border: 1.5px solid rgba(242,239,230,0.7);
    border-radius: 2px;
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .fs-controls button:hover { background: rgba(0,0,0,0.85); }
  .fs-controls button:disabled { opacity: 0.35; cursor: default; }
  .fs-controls button.recording { background: var(--accent); border-color: var(--accent); color: #fff; }

  .task-card {
    display: none;
    max-width: 90vw;
    background: var(--paper2);
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    padding: 12px 20px;
    text-align: center;
  }
  .task-card.active { display: block; }
  .task-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.55;
    margin-bottom: 5px;
  }
  #taskText { font-size: 0.95rem; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  select, button {
    background: var(--paper2);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  button:hover, select:hover { background: var(--ink); color: var(--paper2); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:disabled:hover { background: var(--paper2); color: var(--ink); }
  button.recording { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6; min-height: 1.2em; }
  #snapshot { display: none; }
  a.download-link {
    color: var(--ink);
    font-size: 0.75rem;
    text-decoration: underline;
  }

  #archiveSection { width: 100%; max-width: 960px; }
  .archive-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
  }
  .archive-header .sub {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .archive-empty {
    opacity: 0.55;
    font-size: 0.78rem;
    margin-top: 14px;
  }

  .archive-folder { margin-top: 26px; }
  .archive-folder-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  .archive-folder-title .num {
    font-weight: 600;
    min-width: 1.6em;
  }
  .archive-folder-title .name { white-space: normal; }
  .archive-folder-title .rule {
    flex: 1;
    border-bottom: 1px dashed var(--line);
    transform: translateY(-4px);
  }
  .archive-folder-title .count {
    opacity: 0.5;
    font-variant-numeric: tabular-nums;
  }

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
  .archive-item {
    background: var(--paper2);
    border: 1px solid var(--ink);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .archive-item img, .archive-item video {
    width: 100%;
    height: 125px;
    object-fit: cover;
    background: #000;
    display: block;
    border-bottom: 1px solid var(--ink);
  }
  .archive-item-meta {
    padding: 7px 9px 2px;
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    display: flex;
    justify-content: space-between;
    opacity: 0.85;
  }
  .archive-item-meta .idx { font-weight: 600; }
  .archive-item-stamp {
    padding: 0 9px 6px;
    font-size: 0.6rem;
    opacity: 0.55;
  }
  .archive-item-actions {
    display: flex;
    gap: 10px;
    padding: 2px 9px 9px;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .archive-item-actions button, .archive-item-actions a {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(27,25,22,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--paper2);
    border: 2px solid var(--ink);
    border-radius: 2px;
    padding: 22px;
    max-width: 360px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .modal select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>

<div class="meta-bar">
  <span id="metaDate">—</span>
  <span>CIID Photobooth Archive</span>
  <span id="metaTime">—</span>
</div>

<h1>Live Camera Feed</h1>

<div class="frame" id="frame">
  <video id="video" autoplay playsinline muted></video>
  <div class="rec-dot" id="recDot"><span class="dot"></span><span>Rec</span></div>
  <div class="fs-controls" id="fsControls">
    <button id="fsSnapBtn" disabled>Take Snapshot</button>
    <button id="fsRecordBtn" disabled>Record Video</button>
    <button id="fsExitBtn">Exit Full Screen</button>
  </div>
</div>

<div class="task-card" id="taskCard">
  <div class="task-label">Your task</div>
  <div id="taskText"></div>
</div>

<div class="controls">
  <select id="cameraSelect"></select>
  <button id="toggleBtn">Start</button>
  <button id="snapBtn" disabled>Take Snapshot</button>
  <button id="recordBtn" disabled>Record Video</button>
  <button id="mirrorBtn">Toggle Mirror</button>
  <button id="fullscreenBtn">Full Screen</button>
  <button id="importBtn">Import</button>
  <input type="file" id="importInput" accept="image/*,video/*" multiple style="display:none">
</div>

<div id="status">Camera is off.</div>
<a id="snapLink" class="download-link" download="snapshot.png" style="display:none">Download snapshot</a>

<canvas id="snapshot"></canvas>

<div id="archiveSection">
  <div class="archive-header">
    <h2>Archive</h2>
    <span class="sub" id="archiveCount"></span>
    <button id="clearBtn">Clear archive</button>
  </div>
  <div class="archive-empty" id="archiveEmpty">Nothing saved yet. Snapshots and recordings you take here will show up below, on this browser only.</div>
  <div id="archiveContainer"></div>
</div>

<div class="modal-overlay" id="importModalOverlay">
  <div class="modal">
    <div class="modal-title">Which folder should these go in?</div>
    <select id="importCategorySelect"></select>
    <div class="modal-actions">
      <button id="importConfirmBtn">Add to archive</button>
      <button id="importCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const frameEl = document.getElementById('frame');
const toggleBtn = document.getElementById('toggleBtn');
const snapBtn = document.getElementById('snapBtn');
const recordBtn = document.getElementById('recordBtn');
const mirrorBtn = document.getElementById('mirrorBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const importBtn = document.getElementById('importBtn');
const importInput = document.getElementById('importInput');
const cameraSelect = document.getElementById('cameraSelect');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('snapshot');
const snapLink = document.getElementById('snapLink');
const recDot = document.getElementById('recDot');
const taskCard = document.getElementById('taskCard');
const taskTextEl = document.getElementById('taskText');
const archiveContainer = document.getElementById('archiveContainer');
const archiveEmpty = document.getElementById('archiveEmpty');
const archiveCount = document.getElementById('archiveCount');
const importModalOverlay = document.getElementById('importModalOverlay');
const importCategorySelect = document.getElementById('importCategorySelect');
const importConfirmBtn = document.getElementById('importConfirmBtn');
const importCancelBtn = document.getElementById('importCancelBtn');
const metaDate = document.getElementById('metaDate');
const metaTime = document.getElementById('metaTime');
const clearBtn = document.getElementById('clearBtn');
const fsSnapBtn = document.getElementById('fsSnapBtn');
const fsRecordBtn = document.getElementById('fsRecordBtn');
const fsExitBtn = document.getElementById('fsExitBtn');

let stream = null;
let mirrored = true;
let mediaRecorder = null;
let recordedChunks = [];
let currentTask = null;
let pendingImportFiles = [];

/* ---------- Live meta clock ---------- */

function updateClock() {
  const now = new Date();
  const month = now.toLocaleString('en-US', { month: 'short' }).toUpperCase();
  metaDate.textContent = month + ' ' + now.getFullYear() + ' · ' + String(now.getDate()).padStart(2, '0');
  metaTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

function formatStamp(ts) {
  const d = new Date(ts);
  const day = String(d.getDate()).padStart(2, '0');
  const month = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return day + ' ' + month + ' ' + d.getFullYear() + ' · ' + time;
}

/* ---------- Silly tasks ---------- */

const TASKS = [
  'Balance a pen on your nose (or attempt to, dramatically failing counts).',
  'Sprint (in place) like you just remembered a deadline.',
  'Do a victory lap around your desk like you just shipped a feature.',
  'Strike a superhero landing pose, like you just teleported into the studio.',
  'Show your best shrimp-working pose, but on the move.',
  'Jump and freeze mid-air like you just had a big idea.',
  'Do an interpretive dance of "user testing gone wrong."',
  'Do a dramatic slow-motion dive to catch a falling sticky note.',
  'Do a dramatic collapse onto a chair like the prototype finally works.',
  'Spin around once and strike a pose like you just aced a pitch.'
];

function pickNewTask() {
  currentTask = TASKS[Math.floor(Math.random() * TASKS.length)];
  taskTextEl.textContent = currentTask;
  taskCard.classList.add('active');
}

function clearTask() {
  currentTask = null;
  taskCard.classList.remove('active');
}

/* ---------- IndexedDB archive storage ---------- */

const DB_NAME = 'webcamArchiveDB';
const STORE_NAME = 'items';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function addArchiveItem(blob, type, category) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ blob, type, category: category || 'Uncategorized', timestamp: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getAllArchiveItems() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result.sort((a, b) => b.timestamp - a.timestamp));
    req.onerror = () => reject(req.error);
  });
}

async function deleteArchiveItem(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function clearArchive() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

clearBtn.addEventListener('click', async () => {
  if (!confirm('Delete everything in the archive on this device? This cannot be undone.')) return;
  await clearArchive();
  renderArchive();
});

function buildArchiveCard(item, idxLabel) {
  const url = URL.createObjectURL(item.blob);
  const card = document.createElement('div');
  card.className = 'archive-item';

  const media = document.createElement(item.type === 'video' ? 'video' : 'img');
  media.src = url;
  if (item.type === 'video') { media.controls = true; }
  card.appendChild(media);

  const meta = document.createElement('div');
  meta.className = 'archive-item-meta';
  meta.innerHTML = '<span class="idx">' + idxLabel + '</span><span>' + (item.type === 'video' ? 'VIDEO' : 'PHOTO') + '</span>';
  card.appendChild(meta);

  const stamp = document.createElement('div');
  stamp.className = 'archive-item-stamp';
  stamp.textContent = formatStamp(item.timestamp);
  card.appendChild(stamp);

  const actions = document.createElement('div');
  actions.className = 'archive-item-actions';

  const dl = document.createElement('a');
  dl.href = url;
  dl.download = (item.type === 'video' ? 'recording-' : 'snapshot-') + item.timestamp + (item.type === 'video' ? '.webm' : '.png');
  dl.textContent = 'Download';
  actions.appendChild(dl);

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete';
  delBtn.addEventListener('click', async () => {
    await deleteArchiveItem(item.id);
    renderArchive();
  });
  actions.appendChild(delBtn);

  card.appendChild(actions);
  return card;
}

async function renderArchive() {
  const items = await getAllArchiveItems();
  archiveContainer.innerHTML = '';
  archiveEmpty.style.display = items.length ? 'none' : 'block';
  archiveCount.textContent = items.length ? items.length + ' item' + (items.length === 1 ? '' : 's') : '';
  if (!items.length) return;

  // accession numbers based on capture order, oldest = 001
  const byAge = [...items].sort((a, b) => a.timestamp - b.timestamp);
  const idxMap = new Map();
  byAge.forEach((item, i) => idxMap.set(item.id, String(i + 1).padStart(3, '0')));

  // group items by category (i.e. "folder")
  const groups = new Map();
  items.forEach(item => {
    const key = item.category || 'Uncategorized';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });

  // stable folder order: tasks in their defined order, then anything else
  const orderedKeys = [];
  TASKS.forEach(t => { if (groups.has(t)) orderedKeys.push(t); });
  groups.forEach((_, k) => { if (!orderedKeys.includes(k)) orderedKeys.push(k); });

  orderedKeys.forEach(key => {
    const groupItems = groups.get(key);
    const taskIdx = TASKS.indexOf(key);
    const numLabel = taskIdx >= 0 ? String(taskIdx + 1).padStart(2, '0') : '—';

    const folder = document.createElement('div');
    folder.className = 'archive-folder';

    const title = document.createElement('div');
    title.className = 'archive-folder-title';
    title.innerHTML =
      '<span class="num">' + numLabel + '</span>' +
      '<span class="name">' + key + '</span>' +
      '<span class="rule"></span>' +
      '<span class="count">(' + groupItems.length + ')</span>';
    folder.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'archive-grid';
    groupItems.forEach(item => grid.appendChild(buildArchiveCard(item, '(' + idxMap.get(item.id) + ')')));
    folder.appendChild(grid);

    archiveContainer.appendChild(folder);
  });
}

/* ---------- Import from file (e.g. photos taken on your phone) ---------- */

importBtn.addEventListener('click', () => importInput.click());

importInput.addEventListener('change', (e) => {
  pendingImportFiles = Array.from(e.target.files || []);
  if (!pendingImportFiles.length) return;

  importCategorySelect.innerHTML = '';
  TASKS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    importCategorySelect.appendChild(opt);
  });
  const uncatOpt = document.createElement('option');
  uncatOpt.value = 'Uncategorized';
  uncatOpt.textContent = 'Uncategorized';
  importCategorySelect.appendChild(uncatOpt);

  importModalOverlay.classList.add('active');
});

importConfirmBtn.addEventListener('click', async () => {
  const category = importCategorySelect.value;
  statusEl.textContent = 'Importing ' + pendingImportFiles.length + ' file(s)...';
  for (const file of pendingImportFiles) {
    const type = file.type.startsWith('video') ? 'video' : 'photo';
    await addArchiveItem(file, type, category);
  }
  pendingImportFiles = [];
  importInput.value = '';
  importModalOverlay.classList.remove('active');
  await renderArchive();
  statusEl.textContent = stream ? 'Live.' : 'Camera is off.';
});

importCancelBtn.addEventListener('click', () => {
  pendingImportFiles = [];
  importInput.value = '';
  importModalOverlay.classList.remove('active');
});

/* ---------- Camera ---------- */

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    cameraSelect.innerHTML = '';
    cams.forEach((cam, i) => {
      const opt = document.createElement('option');
      opt.value = cam.deviceId;
      opt.textContent = cam.label || `Camera ${i + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch (err) {
    // labels/devices may be empty until permission is granted; that's fine
  }
}

async function startCamera() {
  try {
    statusEl.textContent = 'Requesting camera access...';
    const constraints = {
      video: cameraSelect.value
        ? { deviceId: { exact: cameraSelect.value } }
        : true,
      audio: true
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await listCameras(); // refresh labels now that permission is granted
    toggleBtn.textContent = 'Stop';
    snapBtn.disabled = false;
    recordBtn.disabled = false;
    fsSnapBtn.disabled = false;
    fsRecordBtn.disabled = false;
    statusEl.textContent = 'Live.';
    pickNewTask();
  } catch (err) {
    statusEl.textContent = 'Could not access camera: ' + err.message;
  }
}

function stopCamera() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  toggleBtn.textContent = 'Start';
  snapBtn.disabled = true;
  recordBtn.disabled = true;
  fsSnapBtn.disabled = true;
  fsRecordBtn.disabled = true;
  statusEl.textContent = 'Camera is off.';
  clearTask();
}

toggleBtn.addEventListener('click', () => {
  if (stream) stopCamera(); else startCamera();
});

mirrorBtn.addEventListener('click', () => {
  mirrored = !mirrored;
  video.style.transform = mirrored ? 'scaleX(-1)' : 'none';
});

fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    const req = frameEl.requestFullscreen || frameEl.webkitRequestFullscreen;
    if (req) req.call(frameEl);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});

/* ---------- Snapshot ---------- */

function takeSnapshot() {
  if (!stream) return;
  const usedTask = currentTask;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  if (mirrored) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const dataUrl = canvas.toDataURL('image/png');
    snapLink.href = dataUrl;
    snapLink.style.display = 'inline-block';
    snapLink.textContent = 'Download snapshot (' + new Date().toLocaleTimeString() + ')';
    await addArchiveItem(blob, 'photo', usedTask);
    renderArchive();
    pickNewTask();
  }, 'image/png');
}

snapBtn.addEventListener('click', takeSnapshot);
fsSnapBtn.addEventListener('click', takeSnapshot);

/* ---------- Video recording ---------- */

function pickMimeType() {
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

function setRecordingUI(isRecording) {
  [recordBtn, fsRecordBtn].forEach(btn => {
    btn.classList.toggle('recording', isRecording);
    btn.textContent = isRecording ? 'Stop Recording' : 'Record Video';
  });
}

function toggleRecording() {
  if (!stream) return;
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  recordedChunks = [];
  const mimeType = pickMimeType();
  const taskAtRecordStart = currentTask;
  try {
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  } catch (err) {
    statusEl.textContent = 'Recording not supported: ' + err.message;
    return;
  }
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    recDot.classList.remove('active');
    setRecordingUI(false);
    const wasLive = !!stream;
    if (recordedChunks.length) {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
      await addArchiveItem(blob, 'video', taskAtRecordStart);
      renderArchive();
    }
    if (wasLive) {
      pickNewTask();
      statusEl.textContent = 'Live.';
    } else {
      statusEl.textContent = 'Camera is off.';
    }
  };
  mediaRecorder.start();
  recDot.classList.add('active');
  setRecordingUI(true);
  statusEl.textContent = 'Recording...';
}

recordBtn.addEventListener('click', toggleRecording);
fsRecordBtn.addEventListener('click', toggleRecording);

fsExitBtn.addEventListener('click', () => {
  (document.exitFullscreen || document.webkitExitFullscreen).call(document);
});

cameraSelect.addEventListener('change', () => {
  if (stream) { stopCamera(); startCamera(); }
});

window.addEventListener('beforeunload', stopCamera);

listCameras();
renderArchive();
</script>
